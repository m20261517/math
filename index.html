<!doctype html>
<!--
  ==========================================================================
  초등학교 6학년 수학 6단원 「원기둥, 원뿔, 구」 수업용 웹 앱
  - 티처블 머신(Teachable Machine)으로 학습한 이미지 분류 모델을 불러와
    카메라 화면 또는 업로드한 사진이 원기둥/원뿔/구 중 무엇인지 판정합니다.
  - 모델 파일(model.json, metadata.json, 가중치)만 인터넷에서 내려받고,
    실제 이미지 분석은 학생의 브라우저 안에서만 이루어집니다.
  - 카메라는 화면에 계속 보여 주기만 하고, "판정하기"를 누른 순간의
    한 장면만 분석합니다(실시간 연속 판정 아님).
  ==========================================================================
-->
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 문자 인코딩을 UTF-8로 지정 -->
  <meta charset="UTF-8" />
  <!-- 휴대폰·태블릿에서도 화면 폭에 맞게 보이도록 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 브라우저 탭에 표시되는 제목 -->
  <title>6학년 수학 | 원기둥·원뿔·구 구별하기</title>
  <!-- TensorFlow.js: 브라우저에서 AI 모델을 실행하기 위한 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <!-- 티처블 머신 이미지 라이브러리: 모델 불러오기(tmImage.load), 웹캠(tmImage.Webcam), 예측(predict) 기능 제공 -->
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    /* 화면 전체에서 공통으로 쓰는 색상·그림자 값(CSS 변수) */
    :root { --bg:#f4f7fb; --card:rgba(255,255,255,.92); --text:#172033; --muted:#68738a; --primary:#5b5ce2; --primary-dark:#4142ba; --border:#e6eaf2; --shadow:0 20px 50px rgba(38,49,93,.12); }
    /* 모든 요소의 크기 계산에 테두리·안쪽 여백을 포함시킴(레이아웃 계산을 쉽게) */
    * { box-sizing:border-box; }
    /* 페이지 기본 글꼴, 글자색, 배경(위쪽이 밝은 보라빛 그라데이션) */
    body { margin:0; min-width:320px; min-height:100vh; font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at top,#eef1ff 0,#f4f7fb 45%,#eef3f8 100%); }
    /* 전체 내용을 가운데 정렬하고 최대 폭을 960px로 제한 */
    .app { width:min(100% - 32px,960px); margin:0 auto; padding:32px 0 48px; }

    /* ---------- 상단 제목 영역 ---------- */
    header { text-align:center; margin-bottom:24px; }
    /* "초등학교 6학년 수학 · 6단원" 알약 모양 라벨 */
    .eyebrow { display:inline-block; margin-bottom:10px; padding:6px 12px; border-radius:999px; color:var(--primary-dark); background:#e9e9ff; font-size:.78rem; font-weight:800; letter-spacing:.08em; }
    /* 큰 제목: 화면 크기에 따라 1.8rem~3rem 사이에서 자동 조절 */
    h1 { margin:0; font-size:clamp(1.8rem,5vw,3rem); line-height:1.15; }
    /* 제목 아래 안내 문장 */
    .subtitle { margin:12px auto 0; max-width:620px; color:var(--muted); font-size:1rem; line-height:1.6; }

    /* ---------- 카메라 + 결과를 감싸는 큰 카드 ---------- */
    .panel { overflow:hidden; border:1px solid rgba(255,255,255,.8); border-radius:28px; background:var(--card); box-shadow:var(--shadow); backdrop-filter:blur(12px); }
    /* 카메라 영역 안쪽 여백 */
    .camera-area { padding:clamp(16px,4vw,32px); }
    /* 카메라 화면/사진이 표시되는 검은 틀(4:3 비율 유지) */
    .camera-frame { position:relative; display:grid; place-items:center; min-height:280px; overflow:hidden; border-radius:20px; background:#111827; aspect-ratio:4 / 3; }
    /* 웹캠 캔버스가 들어갈 자리 */
    #webcam-container { display:grid; place-items:center; width:100%; height:100%; }
    /* 웹캠 영상과 업로드한 사진 모두 틀 안에 잘리지 않게 맞춰서 표시 */
    #webcam-container canvas, #image-preview { display:block; width:100%; height:100%; object-fit:contain; }
    /* 카메라를 켜기 전 보이는 안내 문구 */
    .camera-placeholder { padding:24px; color:#dbe4ff; text-align:center; line-height:1.6; }
    .camera-placeholder strong { display:block; margin-bottom:8px; font-size:1.1rem; }

    /* ---------- 버튼 영역 ---------- */
    /* 버튼들을 가로로 나열하고, 화면이 좁으면 다음 줄로 넘김 */
    .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:18px; }
    /* 모든 버튼과 "사진 올리기" 라벨의 공통 모양(보라색 그라데이션) */
    button, .file-label { border:0; border-radius:14px; padding:13px 22px; color:#fff; background:linear-gradient(135deg,var(--primary),#7c5cff); box-shadow:0 10px 20px rgba(91,92,226,.25); font:inherit; font-weight:800; cursor:pointer; transition:transform .2s ease,box-shadow .2s ease; }
    /* 마우스를 올리면 살짝 떠오르는 효과 */
    button:hover, .file-label:hover { transform:translateY(-2px); box-shadow:0 14px 24px rgba(91,92,226,.3); }
    /* 비활성화된 버튼은 흐리게 표시 */
    button:disabled { cursor:wait; opacity:.65; transform:none; }
    /* "좌우 반전" 버튼: 보조 버튼이라 연한 색 */
    #flip-button { color:var(--primary-dark); background:#eef0ff; box-shadow:none; }
    #flip-button:hover { box-shadow:0 8px 18px rgba(91,92,226,.15); }
    /* "판정하기" 버튼: 핵심 동작이라 눈에 띄는 주황색 */
    #judge-button { background:linear-gradient(135deg,#e67e22,#f39c12); box-shadow:0 10px 20px rgba(230,126,34,.24); }
    /* "사진 올리기" 라벨: 초록색 */
    .file-label { background:linear-gradient(135deg,#16a085,#27ae60); box-shadow:0 10px 20px rgba(22,160,133,.22); }
    /* 실제 파일 선택 input은 화면에서 숨김(대신 라벨을 눌러 열도록 함). 
       display:none 대신 이 방식을 써서 화면 읽기 프로그램 등 접근성은 유지 */
    #image-input { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

    /* ---------- 상태 메시지 ---------- */
    .status { min-height:24px; margin:14px 0 0; color:var(--muted); text-align:center; font-size:.9rem; line-height:1.5; }
    /* 오류일 때는 빨간 글씨 */
    .status.error { color:#c0394b; font-weight:700; }
    /* 개인정보 보호 안내 문구 */
    .privacy-note { margin:10px 0 0; color:var(--muted); text-align:center; font-size:.8rem; }

    /* ---------- 판정 결과 영역 ---------- */
    .result-card { padding:clamp(20px,4vw,34px); border-top:1px solid var(--border); }
    /* "현재 판정 결과 / 도형 이름 / 확률"을 한 줄로 배치 */
    .prediction { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:center; gap:10px 16px; margin-bottom:24px; text-align:center; }
    .prediction-label { color:var(--muted); font-size:clamp(1rem,3vw,1.25rem); font-weight:700; }
    /* 가장 확률이 높은 도형 이름(크게 표시) */
    #top-label { color:var(--primary-dark); font-size:clamp(2rem,8vw,4rem); font-weight:900; letter-spacing:-.05em; }
    /* 그 도형의 확률(%) */
    #top-probability { font-size:clamp(1.6rem,6vw,3rem); font-weight:900; }
    /* 세 도형의 확률 카드를 3칸 격자로 배치 */
    .probabilities { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .probability-item { padding:16px; border:1px solid var(--border); border-radius:16px; background:#fbfcff; }
    /* 카드 윗줄: 왼쪽에 도형 이름, 오른쪽에 확률 */
    .probability-header { display:flex; justify-content:space-between; gap:8px; margin-bottom:10px; font-weight:800; }
    .probability-value { color:var(--primary-dark); }
    /* 확률 막대그래프의 회색 바탕 */
    .bar { height:9px; overflow:hidden; border-radius:999px; background:#e9ecf5; }
    /* 확률만큼 채워지는 보라색 막대(처음엔 0, 값이 바뀌면 부드럽게 늘어남) */
    .bar-fill { width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,#6968f0,#9a73ff); transition:width .25s ease; }

    /* 맨 아래 안내 문구 */
    footer { margin-top:18px; color:var(--muted); text-align:center; font-size:.8rem; line-height:1.5; }

    /* 화면 폭 640px 이하(휴대폰): 여백을 줄이고 확률 카드를 세로 한 줄로 배치 */
    @media (max-width:640px) { .app { width:min(100% - 20px,960px); padding-top:20px; } .panel { border-radius:22px; } .camera-frame { border-radius:16px; min-height:220px; } .probabilities { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="app">
    <!-- ===== 상단 제목 영역 ===== -->
    <header>
      <span class="eyebrow">초등학교 6학년 수학 · 6단원</span>
      <h1>원기둥 · 원뿔 · 구 구별하기</h1>
      <p class="subtitle">카메라에 입체도형을 비추거나 사진을 올려 보세요.<br>AI가 원기둥, 원뿔, 구 중 어떤 도형인지 알려줍니다.</p>
    </header>

    <!-- ===== 카메라 + 결과 카드 ===== -->
    <section class="panel">
      <div class="camera-area">
        <!-- 카메라 영상 또는 업로드한 사진이 표시되는 틀 -->
        <div class="camera-frame">
          <!-- 웹캠 캔버스가 들어갈 자리. 카메라를 켜기 전에는 안내 문구(placeholder)만 보임 -->
          <div id="webcam-container">
            <div class="camera-placeholder" id="placeholder">
              <strong>카메라를 시작하거나 사진을 올려 주세요</strong>
              카메라 영상은 보이기만 하고, <b>판정하기</b>를 눌렀을 때 한 장만 분석합니다.
            </div>
          </div>
          <!-- 사진을 올렸을 때 미리보기로 쓰는 이미지(처음엔 hidden으로 숨김) -->
          <img id="image-preview" alt="선택한 입체도형 사진 미리보기" hidden />
        </div>

        <!-- 조작 버튼들 -->
        <div class="controls">
          <!-- 카메라 켜기 -->
          <button id="start-button" type="button">카메라 시작</button>
          <!-- 현재 카메라 화면 한 장을 판정(카메라가 켜져야 활성화됨) -->
          <button id="judge-button" type="button" disabled>판정하기</button>
          <!-- 카메라 영상 좌우 뒤집기(카메라가 켜져야 활성화됨) -->
          <button id="flip-button" type="button" disabled>좌우 반전: 끔</button>
          <!-- 이 라벨을 누르면 아래 숨겨진 파일 선택 창이 열림 -->
          <label class="file-label" for="image-input">사진 올리기</label>
          <!-- 이미지 파일만 고를 수 있는 파일 선택 input -->
          <input id="image-input" type="file" accept="image/*" />
        </div>

        <!-- 진행 상황·오류 안내 메시지. aria-live로 화면 읽기 프로그램이 바뀐 내용을 읽어 줌 -->
        <p class="status" id="status" aria-live="polite">AI 모델을 준비하고 있습니다.</p>
        <p class="privacy-note">🔒 사진과 카메라 영상은 외부 서버로 전송되지 않습니다.</p>
      </div>

      <!-- 판정 결과 표시 영역 -->
      <div class="result-card">
        <!-- 가장 가능성이 높은 도형 이름과 그 확률 -->
        <div class="prediction" aria-live="polite"><span class="prediction-label">현재 판정 결과</span><strong id="top-label">대기 중</strong><strong id="top-probability">--%</strong></div>
        <!-- 도형별 확률 카드가 자바스크립트로 채워질 자리 -->
        <div class="probabilities" id="probabilities"></div>
      </div>
    </section>

    <footer>AI 모델 파일을 불러오는 것을 제외하고, 이미지 분류는 이 브라우저에서만 처리됩니다.</footer>
  </main>

  <script>
    // =====================================================================
    // 1. 설정값
    // =====================================================================

    // 티처블 머신에서 "모델 내보내기 → 업로드"로 받은 공유 주소
    // (이 주소 뒤에 model.json, metadata.json을 붙여 모델을 불러옴)
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/FqPNxW2We/";

    // 판정 기준 확률(70%). 가장 높은 확률이 이보다 낮으면
    // 도형 이름 대신 "잘 모르겠어요"를 보여 줌 → 애매한 사진에 억지로 답하지 않게 함
    const CONFIDENCE_THRESHOLD = 0.7;

    // 이 앱이 구별하는 세 가지 도형(모델의 클래스 이름을 못 읽었을 때 기본값으로 사용)
    const CLASS_NAMES = ["원기둥", "원뿔", "구"];

    // 모델의 클래스 이름이 영어(cylinder 등)로 되어 있어도 한국어로 바꿔 보여 주기 위한 대응표
    const LABEL_ALIASES = { "원기둥":"원기둥", cylinder:"원기둥", cylinders:"원기둥", "원뿔":"원뿔", cone:"원뿔", cones:"원뿔", "구":"구", sphere:"구", spheres:"구", ball:"구" };

    // =====================================================================
    // 2. 상태를 기억하는 변수
    // =====================================================================
    let model;            // 불러온 티처블 머신 모델
    let webcam;           // 티처블 머신 웹캠 객체
    let animationId;      // 카메라 화면 갱신 반복(requestAnimationFrame)의 번호 — 멈출 때 사용
    let isRunning = false; // 카메라가 켜져 있는지 여부
    let isJudging = false; // 지금 판정 중인지 여부(판정하기 연타 방지)
    let imageObjectUrl;   // 업로드한 사진을 화면에 보여 주기 위한 임시 주소 — 다 쓰면 해제

    // =====================================================================
    // 3. 화면 요소 가져오기
    // =====================================================================

    // document.getElementById를 짧게 쓰기 위한 도우미 함수
    const $ = (id) => document.getElementById(id);
    const startButton = $("start-button");
    const judgeButton = $("judge-button");
    const flipButton = $("flip-button");
    const imageInput = $("image-input");
    const status = $("status");
    const placeholder = $("placeholder");
    const webcamContainer = $("webcam-container");
    const imagePreview = $("image-preview");
    const topLabel = $("top-label");
    const topProbability = $("top-probability");
    const probabilities = $("probabilities");

    // =====================================================================
    // 4. 도우미 함수
    // =====================================================================

    // 모델이 돌려준 클래스 이름을 "원기둥/원뿔/구" 중 하나의 한국어 이름으로 바꿈
    // ① 앞뒤 공백 제거 + 소문자 변환 후 대응표(LABEL_ALIASES)에서 찾고
    // ② 없으면 "원기둥 사진"처럼 도형 이름이 포함된 경우를 찾고
    // ③ 그래도 없으면 원래 이름을 그대로 사용
    function normalizeLabel(label) {
      const key = String(label).trim().toLowerCase();
      return LABEL_ALIASES[key] || CLASS_NAMES.find((name) => key.includes(name)) || label;
    }

    // 상태 메시지를 바꾸고, isError가 true면 빨간 글씨(error 클래스)로 표시
    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    // 도형별 확률 카드(이름 + 퍼센트 + 막대)를 만들어 화면에 넣음
    // 카드 순서는 모델의 클래스 순서와 같고, 각 카드에 probability-0, bar-0 … 처럼
    // 번호가 붙은 id를 줘서 나중에 predict()에서 값을 채워 넣을 수 있게 함
    function createProbabilityCards(labels) {
      const classLabels = labels.length ? labels : CLASS_NAMES;
      probabilities.innerHTML = classLabels.map((label, index) => `
        <div class="probability-item">
          <div class="probability-header"><span>${normalizeLabel(label)}</span><span class="probability-value" id="probability-${index}">0.0%</span></div>
          <div class="bar"><div class="bar-fill" id="bar-${index}"></div></div>
        </div>
      `).join("");
    }

    // =====================================================================
    // 5. 모델 불러오기
    // =====================================================================

    // 페이지가 열리면 바로 실행됨. 인터넷에서 모델 파일을 내려받아 준비함
    async function loadModel() {
      try {
        setStatus("AI 모델을 불러오는 중입니다...");
        // model.json(신경망 구조·가중치 정보)과 metadata.json(클래스 이름 등)을 불러옴
        model = await tmImage.load(`${MODEL_URL}model.json`, `${MODEL_URL}metadata.json`);
        // 모델에 들어 있는 클래스 이름 순서대로 확률 카드를 만듦
        createProbabilityCards(model.getClassLabels());
        startButton.disabled = false;
        setStatus("준비되었습니다. 카메라를 시작하거나 사진을 올려 주세요.");
      } catch (error) {
        // 인터넷이 끊겼거나 모델 주소가 잘못된 경우: 오류를 알리고 모든 기능을 막음
        console.error(error);
        setStatus("모델을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.", true);
        startButton.disabled = true;
        judgeButton.disabled = true;
        imageInput.disabled = true;
      }
    }

    // =====================================================================
    // 6. 카메라 켜기 / 끄기
    // =====================================================================

    // 카메라를 완전히 끄고 화면·버튼을 처음 상태로 되돌림
    function stopCamera() {
      isRunning = false;
      // 화면 갱신 반복 중지
      if (animationId) cancelAnimationFrame(animationId);
      animationId = null;
      // 웹캠 스트림을 멈춰서 카메라 표시등도 꺼지게 함
      if (webcam) {
        webcam.stop();
        webcam = null;
      }
      // 웹캠 캔버스를 지우고 안내 문구를 다시 보여 줌
      webcamContainer.innerHTML = "";
      webcamContainer.appendChild(placeholder);
      placeholder.hidden = false;
      // 카메라가 꺼졌으니 판정·반전 버튼은 비활성화
      judgeButton.disabled = true;
      flipButton.disabled = true;
      flipButton.textContent = "좌우 반전: 끔";
      // 모델이 준비된 경우에만 "카메라 시작"을 다시 누를 수 있게 함
      startButton.disabled = !model;
      startButton.textContent = "카메라 시작";
    }

    // 카메라를 켜서 화면에 영상을 보여 줌(아직 판정은 하지 않음)
    async function startCamera() {
      // 모델이 아직 준비되지 않았거나 이미 카메라가 켜져 있으면 아무것도 하지 않음
      if (!model || isRunning) return;
      // 혹시 남아 있는 카메라·사진 미리보기를 먼저 정리
      stopCamera();
      clearImagePreview();
      try {
        startButton.disabled = true;
        setStatus("카메라 권한을 기다리는 중입니다...");
        // 720×540(4:3) 크기의 웹캠 생성. 세 번째 값 false = 처음에는 좌우 반전 안 함
        webcam = new tmImage.Webcam(720, 540, false);
        // facingMode "environment" = 휴대폰·태블릿에서는 후면 카메라를 우선 사용
        // (노트북처럼 후면 카메라가 없으면 있는 카메라를 사용)
        await webcam.setup({ facingMode: "environment" });
        await webcam.play();
        // 캔버스에 CSS로 걸린 뒤집기 효과가 있으면 없앰(좌우 반전은 flip 버튼으로만 제어)
        webcam.canvas.style.transform = "none";
        webcam.canvas.style.webkitTransform = "none";
        // 안내 문구를 숨기고 웹캠 화면을 틀 안에 넣음
        placeholder.hidden = true;
        webcamContainer.prepend(webcam.canvas);
        isRunning = true;
        judgeButton.disabled = false;
        flipButton.disabled = false;
        startButton.textContent = "카메라 실행 중";
        setStatus("도형을 화면 중앙에 맞춘 뒤, 판정하기를 눌러 주세요.");
        // 화면을 계속 새로 그리는 반복 시작
        animationId = window.requestAnimationFrame(cameraLoop);
      } catch (error) {
        // 카메라 권한을 거부했거나, HTTPS가 아닌 주소에서 열었거나, 카메라가 없는 경우
        console.error(error);
        stopCamera();
        setStatus("카메라를 시작할 수 없습니다. 권한과 HTTPS 연결을 확인해 주세요.", true);
      }
    }

    // 매 프레임마다 웹캠 화면을 새로 그림(영상 표시만 하고 예측은 하지 않음)
    // → 계속 예측하지 않으므로 기기 부담이 적고, 결과가 계속 바뀌어 혼란스러운 것도 막음
    function cameraLoop() {
      if (!isRunning || !webcam) return;
      webcam.update();
      animationId = window.requestAnimationFrame(cameraLoop);
    }

    // 좌우 반전 켜기/끄기(전면 카메라로 볼 때 거울처럼 보이게 하고 싶을 때 사용)
    function toggleFlip() {
      if (!webcam || !isRunning) return;
      webcam.flip = !webcam.flip;
      flipButton.textContent = `좌우 반전: ${webcam.flip ? "켬" : "끔"}`;
    }

    // =====================================================================
    // 7. 판정하기(카메라)
    // =====================================================================

    // "판정하기"를 누른 순간의 카메라 화면 한 장을 모델에 넣어 판정
    async function judgeCurrentFrame() {
      // 카메라가 꺼져 있거나 이미 판정 중이면 무시(연타 방지)
      if (!webcam || !isRunning || isJudging) return;
      isJudging = true;
      judgeButton.disabled = true;
      setStatus("현재 화면의 한 장을 판정하는 중입니다...");
      try {
        // 현재 웹캠 캔버스(지금 보이는 화면)를 판정
        // ※ 두 번째 값 "카메라"는 predict 함수에서 받지 않으므로 실제로는 쓰이지 않음
        await predict(webcam.canvas, "카메라");
        setStatus("판정이 끝났습니다. 다시 판정하려면 판정하기를 눌러 주세요.");
      } finally {
        // 성공하든 실패하든 판정 상태를 풀고, 카메라가 켜져 있으면 버튼을 다시 활성화
        isJudging = false;
        judgeButton.disabled = !isRunning;
      }
    }

    // =====================================================================
    // 8. 사진 올리기
    // =====================================================================

    // 파일 선택 창에서 사진을 고르면 실행됨
    function handleImageUpload(event) {
      const file = event.target.files[0];
      // 파일이 없거나 이미지가 아니면 무시
      if (!file || !file.type.startsWith("image/")) return;
      // 카메라는 끄고, 이전 사진 미리보기는 정리
      stopCamera();
      clearImagePreview();
      // 고른 파일을 서버에 올리지 않고, 브라우저 안에서만 쓰는 임시 주소로 만들어 미리보기에 표시
      imageObjectUrl = URL.createObjectURL(file);
      imagePreview.src = imageObjectUrl;
      imagePreview.hidden = false;
      webcamContainer.hidden = true;
      // 사진이 다 불러와진 뒤에 판정해야 하므로 onload에서 예측 실행
      imagePreview.onload = async () => {
        setStatus("사진 한 장을 브라우저에서 분석하는 중입니다...");
        // ※ 두 번째 값 "사진"도 predict 함수에서 쓰이지 않음
        await predict(imagePreview, "사진");
        setStatus("사진 판정이 끝났습니다. 다른 사진을 올리거나 카메라를 사용할 수 있습니다.");
      };
    }

    // 사진 미리보기를 지우고 웹캠 영역을 다시 보이게 함
    function clearImagePreview() {
      imagePreview.onload = null;
      imagePreview.removeAttribute("src");
      imagePreview.hidden = true;
      webcamContainer.hidden = false;
      // 임시 주소를 해제해서 메모리를 돌려줌
      if (imageObjectUrl) {
        URL.revokeObjectURL(imageObjectUrl);
        imageObjectUrl = null;
      }
    }

    // =====================================================================
    // 9. 예측(판정)과 결과 표시 — 카메라와 사진이 함께 쓰는 핵심 함수
    // =====================================================================

    // source: 판정할 이미지(웹캠 캔버스 또는 <img> 요소)
    async function predict(source) {
      if (!model) return;
      try {
        // 모델이 각 도형일 확률을 계산해 [{className, probability}, …] 형태로 돌려줌
        const predictions = await model.predict(source);
        // 원본 순서는 유지하기 위해 복사본을 만들어 확률이 높은 순으로 정렬
        const sorted = [...predictions].sort((a, b) => b.probability - a.probability);
        // 가장 확률이 높은 도형
        const best = sorted[0];
        const bestProbability = best ? best.probability : 0;
        // 기준(70%) 이상이면 도형 이름, 미만이면 "잘 모르겠어요" 표시
        topLabel.textContent = bestProbability >= CONFIDENCE_THRESHOLD ? normalizeLabel(best.className) : "잘 모르겠어요";
        // 가장 높은 확률을 소수 첫째 자리까지 퍼센트로 표시
        topProbability.textContent = `${(bestProbability * 100).toFixed(1)}%`;
        // 도형별 카드의 퍼센트 숫자와 막대 길이를 갱신
        // (정렬 전 원래 순서 predictions를 써야 카드 번호와 순서가 맞음)
        predictions.forEach((prediction, index) => {
          const percent = prediction.probability * 100;
          const value = $(`probability-${index}`);
          const bar = $(`bar-${index}`);
          if (value) value.textContent = `${percent.toFixed(1)}%`;
          if (bar) bar.style.width = `${percent}%`;
        });
        // 확신이 낮을 때는 상태 메시지로도 알려 줌
        // ※ 이 메시지는 predict가 끝난 직후 호출한 쪽(judgeCurrentFrame, handleImageUpload)의
        //   "판정이 끝났습니다" 메시지로 곧바로 덮어써져 화면에는 거의 보이지 않음
        if (bestProbability < CONFIDENCE_THRESHOLD) setStatus("도형을 확실하게 판단하기 어렵습니다.");
      } catch (error) {
        // 이미지 분석 중 오류(손상된 이미지 등)
        // ※ 오류는 여기서 처리되고 다시 던지지 않으므로, 이후 호출한 쪽의 "판정이 끝났습니다"
        //   메시지가 이 오류 메시지를 덮어쓸 수 있음
        console.error(error);
        setStatus("이미지를 분석하지 못했습니다. 다른 사진을 사용해 주세요.", true);
      }
    }

    // =====================================================================
    // 10. 이벤트 연결 및 시작
    // =====================================================================

    // 각 버튼·파일 선택에 동작 연결
    startButton.addEventListener("click", startCamera);
    judgeButton.addEventListener("click", judgeCurrentFrame);
    flipButton.addEventListener("click", toggleFlip);
    imageInput.addEventListener("change", handleImageUpload);

    // 페이지를 닫거나 이동할 때 카메라를 끄고 임시 사진 주소를 정리
    window.addEventListener("beforeunload", () => {
      stopCamera();
      clearImagePreview();
    });

    // 페이지가 열리면 바로 모델 불러오기 시작
    loadModel();
  </script>
</body>
</html>
